version: '3.8'
services:
  mlflow:
    image: ghcr.io/mlflow/mlflow
    container_name: modelops-mlflow
    ports:
      - "127.0.0.1:5000:5000"
    volumes:
      - ./mlflow-data:/mlflow
    
    command:
      - python
      - -m
      - mlflow
      - server
      - --host
      - 0.0.0.0
      - --port
      - "5000"
      - --backend-store-uri
      - sqlite:////mlflow/mlflow.db
      - --artifacts-destination
      - /mlflow/artifacts
      - --workers
      - "1"
      - --allowed-hosts
      - "mlflow:5000,mlflow,localhost,localhost:5000,127.0.0.1,127.0.0.1:5000"
    restart: unless-stopped
  trainer:
    build:
      context: .
      dockerfile: Dockerfile.train
    container_name: modelops-trainer
    volumes:
      - ./artifacts:/app/artifacts
    environment:
      MLFLOW_TRACKING_URI: http://mlflow:5000
    depends_on:
      - mlflow
    profiles:
      - training
  api:
    build:
      context: .
      dockerfile: Dockerfile.inference
    ports:
      - "8001:8000"
    volumes:
      - ./artifacts:/app/artifacts:ro
    restart: unless-stopped
    